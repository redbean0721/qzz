# Cloudflare Tunnel：qzz.tw/v1/* 從 Cloudflare 經這裡進到 qzz-api Service，節點不用開任何對外 port。
# Tunnel 的 public hostname 在 Cloudflare dashboard 設定（見 deploy/README.md）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: qzz
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: qzz
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: qzz
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          # /ready 在連上 Cloudflare edge 後才回 200
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
