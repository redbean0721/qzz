name: API

on:
  push:
    branches: [main]
    # deploy/ 不在清單裡：回寫 image tag 的 commit 不會再觸發這個 workflow
    paths:
      - apps/api/**
      - packages/shared/**
      - package.json
      - yarn.lock
      - .node-version
      - .dockerignore
      - .github/workflows/api.yml
  workflow_dispatch:

# 一次只跑一個，避免兩次 push 回寫 image tag 時互相衝突
concurrency:
  group: api-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/redbean0721/qzz-api

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qzz
          POSTGRES_PASSWORD: qzz
          POSTGRES_DB: qzz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qzz -d qzz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://qzz:qzz@127.0.0.1:5432/qzz
      REDIS_URL: redis://127.0.0.1:6379
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies (api + shared only)
        run: |
          corepack enable
          yarn workspaces focus @qzz/api @qzz/shared

      - run: yarn build:shared
      - run: yarn workspace @qzz/api typecheck
      - run: yarn workspace @qzz/api migrate
      - run: yarn workspace @qzz/api test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.TAG }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile 的建置階段固定跑在 amd64，arm64 不需要 QEMU
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # 用最新的 main（不是觸發時的 commit），回寫後才 push 得上去
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          # passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: "Redbean0721 Deploy Bot"
          git_committer_email: "deploy@redbean0721.com"

      # migrate init container 和 api container 的 image 一起改
      - name: Update image tag
        run: |
          sed -i -E "s#(image: ghcr\.io/redbean0721/qzz-api):[^[:space:]]+#\1:${TAG}#" deploy/k8s/deployment.yaml
          grep -n 'image: ghcr.io/redbean0721/qzz-api' deploy/k8s/deployment.yaml

      - name: Commit and Push Changes
        env:
          # 經由環境變數傳入，commit message 的內容不會被當成 shell 指令執行
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if git diff --quiet; then
            echo "deployment.yaml already uses ${TAG}"
            exit 0
          fi
          COMMIT_SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          COMMIT_SUBJECT="${COMMIT_SUBJECT:-manual run}"
          git config user.name "Redbean0721 Deploy Bot"
          git config user.email "deploy@redbean0721.com"
          git status
          git commit -a -S -m "deploy: $COMMIT_SUBJECT" -m "Update image tag to ${TAG}"
          git pull --rebase origin main
          git push origin main
